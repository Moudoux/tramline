# Builds Tramline for linux/arm64 (the Pi), linux/amd64 and darwin/arm64.
# It runs build.sh, so CI uses the same pinned Go container, the same
# checks (stdlib only, gofmt, vet) and the same tests as a local build.
#
# Pushing a tag like v1.2.3 also publishes a GitHub Release with the binaries
# and SHA256SUMS, stamped with the tag as the version.
name: tramline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tramline-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check, test and build
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            export TRAMLINE_VERSION="$REF_NAME"
          else
            export TRAMLINE_VERSION="ci-${SHA:0:12}"
          fi
          ./build.sh

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tramline-${{ github.sha }}
          path: |
            dist/tramline-linux-arm64
            dist/tramline-linux-amd64
            dist/tramline-darwin-arm64
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tramline-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "$TAG" --verify-tag --title "Tramline $TAG" --generate-notes \
            tramline-linux-arm64 tramline-linux-amd64 tramline-darwin-arm64 SHA256SUMS
